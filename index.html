    <main>
      <!-- Loads the specified .html file -->
      <section class="hero" id="hero">
  <div class="hero__overlay">
    <div class="container hero__container">
      <div class="hero__content">
        <h1 class="hero__title"></h1>

        <div class="hero__rating" aria-label="Movie rating">
          <span class="hero__rating-stars" aria-hidden="true">
          <span class="hero__rating-stars-bg">☆☆☆☆☆</span>
            <span class="hero__rating-stars-fill">★★★★★</span>
          </span>
        </div>

        <p class="hero__description"></p>

        <div class="hero__actions">
          <button class="hero__button hero__button--trailer" type="button">
            Watch trailer
          </button>

          <button class="hero__button hero__button--details" type="button">
            More details
          </button>
        </div>
      </div>
    </div>
  </div>
</section>

      <section class="weekly-trends">
  <div class="container">
    <div class="weekly-trends__header">
      <h2 class="weekly-trends__title">Weekly Trends</h2>
      <a class="weekly-trends__link" href="./catalog.html">See all</a>
    </div>

    <ul class="weekly-trends__list" data-weekly-list></ul>
  </div>
</section>

<section class="upcoming">
  <div class="container">
    <h2 class="upcoming__section-title">Upcoming This Month</h2>

    <div class="upcoming__content" data-upcoming></div>
  </div>
</section>
    </main>

    <div class="modal is-hidden" id="movie-modal" aria-hidden="true">
  <div class="modal__overlay" data-modal-close>
    <div
      class="modal__content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <button
        class="modal__close"
        type="button"
        aria-label="Close modal"
        data-modal-close
      >
        &times;
      </button>

      <div class="modal__body">
        <div class="modal__poster-wrapper">
          <img class="modal__poster" src="" alt="" />
        </div>

        <div class="modal__info">
          <h2 class="modal__title" id="modal-title"></h2>

          <div class="modal__meta">
            <p class="modal__rating">
              <span class="modal__label">Rating</span>
              <span class="modal__rating-value"></span>
            </p>

            <p class="modal__popularity">
              <span class="modal__label">Popularity</span>
              <span class="modal__popularity-value"></span>
            </p>
          </div>

          <p class="modal__overview"></p>

          <button class="modal__library-btn" type="button" data-library-action>
            Add to My Library
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="trailer-modal is-hidden" id="trailer-modal" aria-hidden="true">
  <div class="trailer-modal__overlay" data-trailer-modal-close>
    <div
      class="trailer-modal__content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="trailer-modal-title"
    >
      <button
        class="trailer-modal__close"
        type="button"
        aria-label="Close trailer"
        data-trailer-modal-close
      >
        &times;
      </button>

      <h2 class="trailer-modal__title" id="trailer-modal-title">
        Movie Trailer
      </h2>

      <div class="trailer-modal__video-wrapper">
        <iframe
          class="trailer-modal__video"
          src=""
          title="Movie trailer"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          allowfullscreen
        ></iframe>
      </div>
    </div>
  </div>
</div>

        GoIT Students
      </button>
    </p>
  </div>
</footer>

</html>
